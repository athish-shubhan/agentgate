# GitHub composite action: build agentgate, compare baseline and candidate
# results, post the report as a PR comment, fail the job on a regression.
# Exercised by the `action` job in .github/workflows/ci.yml; the command it
# runs is the same `agentgate compare` used in results/.
name: AgentGate
description: Gate a PR on agent eval results with a paired, task-clustered test
inputs:
  base:
    description: baseline results file (from main)
    required: true
  candidate:
    description: candidate results file (from the PR)
    required: true
  format:
    description: tau2 | run
    default: tau2
  alpha:
    default: "0.05"
  fail-margin:
    default: "0"
  pass-margin:
    default: "0.05"
  comment:
    description: post the report on the pull request
    default: "true"
outputs:
  verdict:
    description: PASS, FAIL, INCONCLUSIVE, or ERROR when the inputs could not be compared
    value: ${{ steps.gate.outputs.verdict }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.24"
    - name: build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/agentgate" ./cmd/agentgate
    - name: compare
      id: gate
      shell: bash
      # Inputs reach the script as environment variables, never pasted into
      # it, so a file name or margin cannot inject shell code.
      env:
        AG_FORMAT: ${{ inputs.format }}
        AG_BASE: ${{ inputs.base }}
        AG_CAND: ${{ inputs.candidate }}
        AG_ALPHA: ${{ inputs.alpha }}
        AG_FAIL_MARGIN: ${{ inputs.fail-margin }}
        AG_PASS_MARGIN: ${{ inputs.pass-margin }}
      run: |
        set +e
        "$RUNNER_TEMP/agentgate" compare -format "$AG_FORMAT" -base "$AG_BASE" -cand "$AG_CAND" \
          -alpha "$AG_ALPHA" -fail-margin "$AG_FAIL_MARGIN" -pass-margin "$AG_PASS_MARGIN" \
          -md "$RUNNER_TEMP/agentgate.md" -json "$RUNNER_TEMP/agentgate.json" > /dev/null
        code=$?
        echo "exit=$code" >> "$GITHUB_OUTPUT"
        # exit 0 PASS/INCONCLUSIVE, 1 FAIL, 2 bad input (no report is written)
        if [ "$code" -le 1 ]; then
          echo "verdict=$(jq -r .verdict "$RUNNER_TEMP/agentgate.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/agentgate.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
          echo "AgentGate could not compare the runs (exit $code); see the step log." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.gate.outputs.exit != '2'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/agentgate.md" \
          || gh pr comment "$PR" --body-file "$RUNNER_TEMP/agentgate.md"
    - name: verdict
      shell: bash
      env:
        CODE: ${{ steps.gate.outputs.exit }}
      run: exit "$CODE"
