name: ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTGATE_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/agentgate?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build CLI and gate the example run
        run: |
          go build -o bin/agentgate ./cmd/agentgate
          bin/agentgate compare -format run -base examples/run.json -cand examples/run.json -json /tmp/report.json > /dev/null
          jq -e .verdict /tmp/report.json

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  # Runs the composite action in action.yml the way a user's workflow would.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: ok
        uses: ./
        with:
          base: examples/run.json
          candidate: examples/run.json
          format: run
          comment: "false"
      - name: verdict of a no-op comparison
        env:
          VERDICT: ${{ steps.ok.outputs.verdict }}
        run: test "$VERDICT" = INCONCLUSIVE
      - id: bad
        continue-on-error: true
        uses: ./
        with:
          base: examples/run.json
          candidate: does-not-exist.json
          format: run
          comment: "false"
      - name: a missing results file is an error, not a verdict
        env:
          VERDICT: ${{ steps.bad.outputs.verdict }}
          OUTCOME: ${{ steps.bad.outcome }}
        run: test "$VERDICT" = ERROR && test "$OUTCOME" = failure
